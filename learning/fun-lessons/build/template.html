<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
{{FONTS}}
<style>
{{BRIEF}}*/
{{VARS}}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:var(--hf);line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,52px)}h2{font-size:clamp(26px,4vw,36px)}h3{font-size:19px}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}.wrap{max-width:1240px;margin:auto}
.hero{background:var(--field);color:var(--fieldInk)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center}
.hero p{font-size:17.5px;max-width:34em}
.xp{background:#fff;border-radius:18px;padding:14px 16px;margin-top:20px;box-shadow:0 6px 0 var(--shadow);color:#15161c}
.xp b{font-family:var(--hf);font-size:20px}.bar{height:14px;background:var(--tint);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:9px;transition:width .5s}
.small{font-size:13.5px;color:var(--mute)}.xp .small{color:#545768}
.map svg{width:100%;height:auto;display:block}.lobe{cursor:pointer}.lobe:focus{outline:none}.lobe:focus .bub,.lobe:hover .bub{stroke:var(--sun);stroke-width:5}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.jump a,.btn{font:700 15px Nunito;min-height:44px;padding:10px 16px;border-radius:12px;border:2px solid currentColor;background:transparent;color:inherit;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center}
.btn.solid{background:var(--field);border-color:var(--field);color:var(--fieldInk)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.world{border-top:1px solid var(--line)}.world:nth-of-type(even){background:var(--soft)}
.whead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}
.whead p{margin:6px 0 0;max-width:40em;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
details.card{background:var(--card);border:2px solid var(--line);border-radius:18px;transition:border-color .2s}
details.card[open]{border-color:var(--field);grid-column:1/-1}
details.card.done summary .tick{background:var(--sun);color:#15161c;border-color:var(--sun)}
summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
summary::-webkit-details-marker{display:none}
summary .hook{grid-column:1;color:var(--mute);font-size:15px}
.tick{grid-row:1/3;grid-column:2;align-self:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
.body{padding:0 18px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px 24px}
.body section h4{font:700 15px var(--hf);margin:0 0 4px;color:var(--blue)}.body section p{margin:0}
.quiz{grid-column:1/-1;background:var(--soft);border-radius:14px;padding:14px 16px}
.world:nth-of-type(even) .quiz{background:var(--bg)}
.quiz p.q{font-weight:800;margin:0 0 10px}.opts{display:grid;gap:8px}
.opts button{text-align:start;font:600 15.5px Nunito;min-height:44px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opts button.right{border-color:#1b9e5a;background:light-dark(#e6f7ee,#143222)}.opts button.wrong{border-color:#e0453a;background:light-dark(#ffeceb,#3a1a18)}
.why{margin:10px 0 0;font-size:15px}
.games .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.game{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px}
.stage{min-height:190px;display:grid;place-items:center;text-align:center;margin:14px 0;border-radius:14px;background:var(--soft);padding:16px}
.big{font:700 clamp(28px,6vw,44px) var(--hf);margin-bottom:6px}
.stage .opts{max-width:460px;margin:12px auto 0;width:100%}
footer{text-align:center}
@media(max-width:600px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.map{order:2}.xp{order:3}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
{{HERO}}
<main id="worlds"></main>

{{GAMES}}
<footer class="band small"><div class="wrap">Your XP is kept in this browser only. <button class="btn" id="reset" style="margin-left:8px">Reset progress</button></div></footer>

<script>
{
{{DATA}}
function xp(){return Object.keys(S.seen).length*2+Object.values(S.quiz).filter(v=>v).length*10+Object.keys(S.games).length*20}
function hud(){const x=xp();let r=RANKS[0],n=null;for(let i=0;i<RANKS.length;i++){if(x>=RANKS[i][0]){r=RANKS[i];n=RANKS[i+1]||null}}
 document.getElementById('rank').textContent=r[1];document.getElementById('xpnum').textContent=x+" XP";
 document.getElementById('xpbar').style.width=Math.min(100,x/MAX*100)+"%";
 const cleared=T.filter((_,i)=>S.quiz[i]!==undefined).length;
 document.getElementById('xpnext').textContent=cleared+" of "+T.length+" levels cleared · "+(n?(n[0]-x)+" XP to "+n[1]:"Top rank reached");}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById('lobes').innerHTML=W.map((w,k)=>{const r=w.r,tx=k%2?w.x+r*.35:w.x-r*.35;return `<g class="lobe" tabindex="0" role="link" aria-label="Go to ${w.name}" data-w="${w.id}"><path d="M${tx-14} ${w.y+r*.8} L${tx} ${w.y+r*1.18} L${tx+16} ${w.y+r*.78} Z" fill="#fff"/><ellipse class="bub" cx="${w.x}" cy="${w.y}" rx="${r*1.08}" ry="${r*.86}" fill="#fff"/><ellipse cx="${w.x}" cy="${w.y+r*.2}" rx="${r*.9}" ry="${r*.6}" style="fill:var(--tint)" opacity=".7"/><text x="${w.x}" y="${w.y-r*.12}" text-anchor="middle" style="font-family:var(--hf)" font-weight="700" font-size="${r>80?26:22}" fill="#15161c">${w.short}</text><g style="fill:var(--field)">${[-1,0,1].map(d=>`<circle cx="${w.x+d*18}" cy="${w.y+r*.28}" r="6"/>`).join('')}</g></g>`}).join('');
document.getElementById('jump').innerHTML=W.map(w=>`<a href="#${w.id}">${w.name}</a>`).join('')+`<a href="#games">Games</a>`;
document.querySelectorAll('.lobe').forEach(g=>{const go=()=>document.getElementById(g.dataset.w).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});

document.getElementById('worlds').innerHTML=W.map(w=>`<section class="band world" id="${w.id}"><div class="wrap"><div class="whead"><div><h2>${w.name}</h2><p>${w.blurb}</p></div><span class="small" id="cnt-${w.id}"></span></div><div class="grid">${T.map((t,i)=>t.w!==w.id?'':`<details class="card" data-i="${i}"><summary><h3>${esc(t.t)}</h3><span class="hook">${esc(t.h)}</span><span class="tick" aria-hidden="true">+12</span></summary><div class="body"><section><h4>The story</h4><p>${esc(t.s)}</p></section><section><h4>The big idea</h4><p>${esc(t.i)}</p></section><section><h4>Spot it in real life</h4><p>${esc(t.l)}</p></section><section><h4>Try it today</h4><p>${esc(t.y)}</p></section><div class="quiz"><p class="q">${esc(t.q)}</p><div class="opts">${t.o.map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join('')}</div><p class="why" hidden></p></div></div></details>`).join('')}</div></div></section>`).join('');

function counts(){W.forEach(w=>{const ids=T.map((t,i)=>t.w===w.id?i:-1).filter(i=>i>=0);document.getElementById('cnt-'+w.id).textContent=ids.filter(i=>S.quiz[i]!==undefined).length+" / "+ids.length+" cleared"})}
function paintQuiz(card,i){const t=T[i];if(S.quiz[i]===undefined)return;card.querySelectorAll('.opts button').forEach(b=>{b.disabled=true;if(+b.dataset.k===t.a)b.classList.add('right')});const w=card.querySelector('.why');w.hidden=false;w.innerHTML=(S.quiz[i]?"<b>Correct, +10 XP.</b> ":"<b>Not quite.</b> ")+esc(t.e);card.classList.add('done');card.querySelector('.tick').textContent='✓'}
document.querySelectorAll('details.card').forEach(card=>{const i=+card.dataset.i;paintQuiz(card,i);
 card.addEventListener('toggle',()=>{if(card.open&&!S.seen[i]){S.seen[i]=1;save();hud()}});
 card.querySelectorAll('.opts button').forEach(b=>b.addEventListener('click',()=>{if(S.quiz[i]!==undefined)return;const ok=+b.dataset.k===T[i].a;S.quiz[i]=ok;if(!ok)b.classList.add('wrong');save();paintQuiz(card,i);hud();counts()}))});

/* generic multi-round game */
function game(stageId,outId,key,rounds,doneMsg){const st=document.getElementById(stageId),out=document.getElementById(outId);
 const play=()=>{let n=0,ok=0;const next=()=>{if(n===rounds.length){st.innerHTML=`<div><div class="big">${ok} / ${rounds.length}</div><button class="btn solid">Play again</button></div>`;st.querySelector('button').onclick=play;out.innerHTML=doneMsg+(S.games[key]?'':' <b>+20 XP.</b>');S.games[key]=1;save();hud();return}
  const r=rounds[n];st.innerHTML=`<div style="width:100%"><div class="big">${esc(r.p)}</div><p class="small">Round ${n+1} of ${rounds.length}</p><div class="opts">${r.o.map((o,k)=>`<button data-k="${k}">${esc(o)}</button>`).join('')}</div><p class="why" hidden></p></div>`;
  st.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const good=+b.dataset.k===r.a;if(good)ok++;st.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(+x.dataset.k===r.a)x.classList.add('right')});if(!good)b.classList.add('wrong');const w=st.querySelector('.why');w.hidden=false;w.innerHTML=esc(r.e)+' <button class="btn solid" style="margin-top:10px">Next</button>';w.querySelector('button').onclick=()=>{n++;next()}})};next()};
 return play}
{{GAMEDATA}}
document.getElementById('reset').onclick=()=>{S={seen:{},quiz:{},games:{}};save();location.reload()};
hud();counts();
}
</script>
</body>
</html>
